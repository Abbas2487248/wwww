name: Build Nasikh Engine APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-nasikh-engine.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nasikh
        uses: actions/checkout@v4
        with:
          path: nasikh

      - name: Checkout VirtualApp engine
        uses: actions/checkout@v4
        with:
          repository: ISEKHON/VirtualApp
          ref: main
          path: engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: yes | sdkmanager "ndk;21.4.7075529"

      - name: Rebrand engine as Nasikh
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          strings = Path("app/src/main/res/values/strings.xml")
          data = strings.read_text()
          data = data.replace('<string name="vxp">VirtualApp</string>', '<string name="vxp">ناسخ</string>')
          data = data.replace('<string name="app_name">VirtualApp</string>', '<string name="app_name">ناسخ</string>')
          strings.write_text(data)
          settings = Path("settings.gradle")
          settings.write_text(settings.read_text().replace('rootProject.name="VirtualApp"', 'rootProject.name="Nasikh"'))
          gradle = Path("app/build.gradle")
          gradle.write_text(gradle.read_text().replace('VirtualApp-${variant.versionName}', 'Nasikh-${variant.versionName}'))
          PY

      - name: Build single host app with all ABIs
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Nasikh APKs
        uses: actions/upload-artifact@v4
        with:
          name: nasikh-engine-apks
          path: |
            engine/app/build/outputs/apk/debug/Nasikh-*.apk
            engine/app/build/outputs/apk/debug/VirtualApp-*.apk
          if-no-files-found: error
          retention-days: 14
