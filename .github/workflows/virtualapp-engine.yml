name: Test VirtualApp Engine

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/virtualapp-engine.yml"

jobs:
  build-engine:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Nasikh repository
        uses: actions/checkout@v4

      - name: Checkout Android 14 VirtualApp engine
        uses: actions/checkout@v4
        with:
          repository: ISEKHON/VirtualApp
          ref: main
          path: virtualapp-engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;30.0.0" "ndk;21.4.7075529"
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/21.4.7075529"

      - name: Build VirtualApp engine host APK
        working-directory: virtualapp-engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload engine test APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-engine-test-apk
          path: virtualapp-engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
