name: Test VirtualApp Engine

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/virtualapp-engine.yml"

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nasikh repository
        uses: actions/checkout@v4

      - name: Checkout Android 14 VirtualApp engine
        uses: actions/checkout@v4
        with:
          repository: ISEKHON/VirtualApp
          ref: main
          path: virtualapp-engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platforms;android-34
            build-tools;30.0.0
            ndk;21.4.7075529

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/21.4.7075529"

      - name: Build VirtualApp engine host APK
        working-directory: virtualapp-engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload engine test APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-engine-test-apk
          path: virtualapp-engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
